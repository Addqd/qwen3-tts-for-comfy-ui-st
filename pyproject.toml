[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-st"
version = "1.0.0"
description = "Local qwentts.cpp compatibility service for SillyTavern and ComfyUI"
readme = "README_RU.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "httpx==0.28.1",
  "torch==2.11.0",
  "silero-stress==1.4",
  "silero==0.5.5",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[project.scripts]
qwen3-tts-st = "qwen3_tts_st.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive"]
addopts = "-ra"
