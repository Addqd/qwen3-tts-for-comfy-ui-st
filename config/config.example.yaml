server:
  host: 127.0.0.1
  port: 8020

qwentts:
  host: 127.0.0.1
  port: 8030
  model_id: tts-1-ru
  language: Russian
  backend: CUDA0
  max_batch: 1
  request_timeout_seconds: 900
  queue_timeout_seconds: 30
  max_chunk_chars: 320

voices:
  library_dir: voice_library
  default_voice: clone:test_ru_dima_neutral

runtime_defaults:
  russian_normalization: full
  auto_stress: silero
  stress_format: plus
  text_enhancement: "off"
  pronunciation_defaults: {}
  seed: -1
  max_new_tokens: 4096
  temperature: 0.75
  top_k: 40
  top_p: 0.90
  repetition_penalty: 1.05

preprocessing:
  remove_markdown: true
  remove_html: true
  remove_chatml: true
  remove_think_blocks: true
  remove_code_blocks: true
  russian_abbreviations:
    "т.е.": "то есть"
    "т.к.": "так как"
    "и т.д.": "и так далее"
    "и т.п.": "и тому подобное"

logging:
  level: INFO
  access_log: false

runtime:
  dir: runtime
  settings_file: runtime/tts-settings.json

silero:
  provision_state: runtime/silero-provisioned.json

comfyui:
  enabled: true
  install_path: ComfyUI_windows_portable
  host: 127.0.0.1
  port: 8188
  manager_enabled: true
  startup_timeout_seconds: 180
  log_path: logs/comfyui.log

integrations:
  sillytavern:
    model: tts-1-ru
    response_format: mp3
  comfyui:
    endpoint: http://127.0.0.1:8020
    timeout_seconds: 900
