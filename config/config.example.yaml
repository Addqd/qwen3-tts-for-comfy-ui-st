server:
  host: 127.0.0.1
  port: 8020

model:
  backend: qwen
  # Legacy single-model keys are retained for older local overrides.
  id: Qwen/Qwen3-TTS-12Hz-0.6B-Base
  cache_dir: model_cache
  # Turing validation: float16 stalled; float32 completed repeatedly.
  dtype: float32
  attention: sdpa
  max_new_tokens: 2048

models:
  default: qwen3-tts-0.6b
  cache_dir: model_cache
  available:
    qwen3-tts-0.6b:
      hf_id: Qwen/Qwen3-TTS-12Hz-0.6B-Base
      aliases: [tts-1-ru-fast]
      runtime:
        mode: inherit
        dtype: float32
        attention: sdpa
        max_new_tokens: 2048
        minimum_free_vram_mb: 6000
        safety_reserve_mb: 750
        reject_shared_memory_pressure: true
    qwen3-tts-1.7b:
      hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      aliases: [tts-1-ru-quality]
      runtime:
        mode: inherit
        dtype: float32
        attention: sdpa
        max_new_tokens: 2048
        # Deliberately conservative for an 8 GB Turing GPU: auto normally
        # selects CPU for 1.7B instead of risking an opaque CUDA OOM.
        minimum_free_vram_mb: 7600
        safety_reserve_mb: 750
        reject_shared_memory_pressure: true

generation:
  presets:
    default: {}
    stable_russian:
      do_sample: true
      temperature: 0.75
      top_k: 40
      top_p: 0.90
      repetition_penalty: 1.05
      subtalker_dosample: true
      subtalker_temperature: 0.75
      subtalker_top_k: 40
      subtalker_top_p: 0.90

request_defaults:
  # OpenAI-compatible clients that cannot send the optional custom fields
  # (including SillyTavern) receive the stable Russian path. Explicit request
  # values such as ComfyUI's Default/Off controls always take precedence.
  generation_preset: stable_russian
  russian_normalization: full

runtime_defaults:
  # Saved local values in runtime/tts-settings.json override these defaults.
  # Explicit request fields still have the highest precedence.
  active_model: tts-1-ru
  multilingual_mode: auto
  chunking_mode: semantic
  leading_silence_ms: 100
  trailing_silence_ms: 150

normalization:
  # Only explicit lexical replacements are made; there is no unsafe blanket
  # replacement of every Russian letter e with yo.
  yo_dictionary:
    "еще": "ещё"
    "ее": "её"
    "елка": "ёлка"
    "ежик": "ёжик"

pronunciation:
  # Global deterministic replacements. Request overrides win on key clashes.
  dictionary: {}

resources:
  mode: auto
  gpu:
    enabled: true
    device: 0
    minimum_free_vram_mb: 6000
    safety_reserve_mb: 750
    reject_shared_memory_pressure: true
  cpu:
    enabled: true
    max_threads: auto
    reserve_threads: 2
  ram:
    safety_reserve_mb: 4096
  external_ai:
    monitor_only: true
    process_names: []
    gpu_reserve_mb: 0
    cpu_reserve_threads: 0
    ram_reserve_mb: 0

voices:
  library_dir: voice_library
  fallback_profile: clone:QwenDemoRussianNeutral

queue:
  max_concurrent: 1
  max_waiting: 4
  wait_timeout_seconds: 30
  generation_timeout_seconds: 900

chunking:
  enabled: true
  max_chars: 320

pauses:
  # Reserved legacy keys. Internal chunks/spans are joined without fixed silence.
  sentence_ms: 80
  paragraph_ms: 220
  segment_ms: 120
  # Small overlap join and outer speech-edge fade; neither inserts zero gaps.
  crossfade_ms: 8
  edge_fade_ms: 5

preprocessing:
  mode: all
  remove_markdown: true
  remove_html: true
  remove_chatml: true
  remove_think_blocks: true
  remove_code_blocks: true
  russian_abbreviations:
    "т.е.": "то есть"
    "т.к.": "так как"
    "и т.д.": "и так далее"
    "и т.п.": "и тому подобное"

logging:
  level: INFO
  access_log: false
  log_full_text: false

runtime:
  dir: runtime
  settings_file: runtime/tts-settings.json

comfyui:
  enabled: true
  install_path: ComfyUI_windows_portable
  host: 127.0.0.1
  port: 8188
  manager_enabled: true
  startup_timeout_seconds: 180
  log_path: logs/comfyui.log

integrations:
  sillytavern:
    model: tts-1-ru
    response_format: mp3
    recommended_generation_preset: stable_russian
    recommended_russian_normalization: full
  comfyui:
    endpoint: http://127.0.0.1:8020
    timeout_seconds: 900
